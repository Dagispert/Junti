# Publica la versión web de la app en GitHub Pages:
#   https://dagispert.github.io/Junti/
# Sirve para abrir Junti desde el navegador del móvil sin tener el ordenador encendido.
name: Publicar versión web

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx expo export -p web
        working-directory: mobile
      # GitHub Pages no conoce las rutas de la app: cualquier dirección carga la app y ella decide.
      - run: cp mobile/dist/index.html mobile/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist
      - id: deploy
        uses: actions/deploy-pages@v4
